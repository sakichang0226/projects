<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン画面 プレビュー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: #f9fafb; }
  </style>
</head>
<body>

<!-- ヘッダー（未ログイン状態） -->
<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <a href="../top/top.html" class="text-xl font-bold text-green-700 shrink-0">🛍 EC Store</a>
    <div class="flex-1 max-w-xl">
      <div class="relative">
        <input type="text" placeholder="商品を検索..." class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
        <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
      </div>
    </div>
    <div class="flex items-center gap-4 shrink-0">
      <a href="../かご/cart.html" class="relative text-gray-600 hover:text-green-700 text-xl">🛒</a>
    </div>
  </div>
</header>

<main class="min-h-[70vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h1 class="text-2xl font-bold text-gray-900 text-center mb-8">ログイン</h1>

      <!-- SfInput: メールアドレス -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
        <input type="email" placeholder="example@email.com"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
      </div>

      <!-- SfInput: パスワード + SfIconVisibility -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
        <div class="relative">
          <input id="passwordInput" type="password" placeholder="パスワードを入力" value="password123"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent pr-12">
          <button onclick="togglePassword()" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600" title="パスワードを表示">
            <span id="eyeIcon">👁</span>
          </button>
        </div>
      </div>

      <!-- エラーメッセージ（認証失敗時） -->
      <div class="mb-5 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm flex items-center gap-2">
        ⚠ メールアドレスまたはパスワードが正しくありません
      </div>

      <!-- SfButton: ログイン -->
      <button class="w-full bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 transition text-lg">
        ログイン
      </button>

      <!-- バリデーションエラー表示 -->
      <div class="mt-6 border-t border-dashed border-gray-200 pt-4">
        <p class="text-center text-sm text-gray-400 mb-3">▼ バリデーションエラー表示</p>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
            <input type="email" value="invalid-email"
              class="w-full border border-red-400 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-400 bg-red-50">
            <p class="text-red-500 text-xs mt-1">有効なメールアドレスを入力してください</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
            <input type="password"
              class="w-full border border-red-400 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-400 bg-red-50">
            <p class="text-red-500 text-xs mt-1">パスワードを入力してください</p>
          </div>
        </div>
      </div>

      <!-- SfLoaderCircular: ローディング状態 -->
      <div class="mt-6 border-t border-dashed border-gray-200 pt-4">
        <p class="text-center text-sm text-gray-400 mb-3">▼ ローディング状態</p>
        <button class="w-full bg-green-600 text-white font-semibold py-3 rounded-lg opacity-75 cursor-not-allowed flex items-center justify-center gap-2 text-lg" disabled>
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          ログイン中...
        </button>
      </div>
    </div>
  </div>
</main>

<footer class="bg-gray-800 text-gray-400 text-center py-6 text-sm">
  © 2025 EC Store Portfolio. All rights reserved.
</footer>

<script>
function togglePassword() {
  const input = document.getElementById('passwordInput');
  const icon = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = '🙈';
  } else {
    input.type = 'password';
    icon.textContent = '👁';
  }
}
</script>

</body>
</html>
